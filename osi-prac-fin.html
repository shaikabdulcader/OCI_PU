  explanation:"Linux permissions map read=4, write=2 and execute=1. The three sets are owner, group and others, so rwx=7, r-x=5 and ---=0.",
  theory:{what:"Linux file permissions control read, write and execute access for the owner, group and everyone else.",why:"They provide a simple least-privilege boundary for files and executable scripts.",how:"Convert each rwx triplet to numbers using 4/2/1 and concatenate the owner, group and other values.",example:"rwxr-x--- becomes 7-5-0, or chmod 750."},
  quick:"rwxr-x--- = 750; the group can read and execute, but cannot write.",
  remember:["r=4, w=2, x=1","Owner / Group / Others = first / second / third digit"],
  trap:"Do not treat the group execute permission as write permission; r-x contains no w.",
  wrongOptionsNote:"640 removes group execute; 755 gives others access; 700 removes all group permissions.",
  diagram:{type:"linear",steps:["Owner: rwx = 7","Group: r-x = 5","Others: --- = 0","Result: 750"]},
  examAnswer:"The mode is 750. The owner can read/write/execute, the group can read/execute, and others have no access.",
  realWorld:"A deployment script can be executable by the deployment team while remaining inaccessible to unrelated users.",
  mcq:{question:"Which permission mode matches rwxr-x---?",options:["700","740","750","755"],correctIndex:2}
},
{
  id:42, day:3, topic:"OCI CIDR and Reserved Addresses",
  question:"A network engineer assigns 10.20.30.0/24 to an OCI subnet. How many IPv4 addresses are in the block, how many does OCI reserve, and how many remain assignable to resources?",
  answer:"A /24 contains 256 addresses. OCI reserves five addresses in each subnet, leaving 251 addresses that can be assigned to resources.",
  explanation:"IPv4 has 32 bits, so /24 leaves 8 host bits: 2^8 = 256 addresses. OCI reserves five addresses in a subnet for networking functions, so 256 - 5 = 251 assignable addresses.",
  theory:{what:"CIDR prefix length determines how many addresses belong to a subnet.",why:"Correct CIDR planning prevents address exhaustion and supports future subnet growth.",how:"Calculate 2^(32-prefix). For /24, 2^8 gives 256 total addresses; then account for OCI's reserved addresses.",example:"10.20.30.0/24 has 256 total addresses and 251 assignable addresses after OCI's five reserved addresses."},
  quick:"/24 = 256 total IPv4 addresses; OCI reserves 5, leaving 251 assignable addresses.",
  remember:["/24 → 8 host bits → 256 total","OCI subnet: total minus 5 reserved = assignable"] ,
  trap:"Do not subtract the traditional two network/broadcast addresses as if this were an ordinary on-premises subnet calculation; use OCI's documented subnet reservation rule.",
  wrongOptionsNote:"128 and 254 result from using the wrong prefix or traditional assumptions; 251 is the OCI assignable count for a /24.",
  diagram:{type:"linear",steps:["10.20.30.0/24","8 host bits","256 total addresses","5 OCI-reserved","251 assignable"]},
  examAnswer:"A /24 contains 256 addresses. OCI reserves five, leaving 251 assignable addresses.",
  realWorld:"An architect uses this calculation before splitting a VCN into web, app and database subnets.",
  mcq:{question:"How many addresses are assignable in an OCI /24 subnet after OCI's five reserved addresses?",options:["250","251","252","254"],correctIndex:1}
},
{
  id:43, day:3, topic:"OCI CLI Profiles and Authentication",
  question:"An engineer uses the OCI CLI from a Windows laptop and from OCI Cloud Shell. Where is the standard local CLI configuration stored, and what is the key authentication difference between the two environments?",
  answer:"The standard local OCI CLI configuration is stored under ~/.oci/config. A laptop commonly uses an API-key-based CLI profile, while Cloud Shell can use its OCI environment authentication mechanisms rather than requiring the same local private-key setup.",
  explanation:"The config file stores CLI profiles and references to credentials used by local CLI operations. Cloud Shell is already an OCI-hosted environment and can use its supported OCI authentication mechanisms, making setup different from a laptop.",
  theory:{what:"OCI CLI profiles define how the CLI identifies the tenancy, user and region and how it authenticates.",why:"Profiles let engineers use different identities or environments without rewriting every command.",how:"Configure a profile locally, then select it with the CLI; in Cloud Shell, use the authentication method available to the hosted OCI environment.",example:"A laptop profile may point to an API key and tenancy OCID, while Cloud Shell can authenticate through its OCI-integrated mechanism."},
  quick:"Local CLI configuration normally lives in ~/.oci/config; laptop CLI commonly uses an API-key profile, while Cloud Shell has OCI-integrated authentication options.",
  remember:["~/.oci/config = CLI profiles","Laptop ≠ Cloud Shell authentication setup"] ,
  trap:"Do not assume Cloud Shell must always be configured exactly like a developer laptop with a copied private key.",
  wrongOptionsNote:"The config file is not a Terraform state file, and authentication is not identical across every CLI execution environment.",
  diagram:{type:"linear",steps:["OCI CLI","Laptop → ~/.oci/config → profile/API key","Cloud Shell → OCI-hosted authentication"]},
  examAnswer:"The default local configuration is ~/.oci/config. Local CLI use commonly relies on an API-key profile, while Cloud Shell can use OCI-integrated authentication mechanisms.",
  realWorld:"A trainer can demonstrate OCI CLI in Cloud Shell without asking every student to copy private keys onto the lab machine.",
  mcq:{question:"Which file normally stores OCI CLI profile configuration on a local machine?",options:["~/.terraformrc","~/.oci/config","/etc/oci/profile","~/.ssh/oci.conf"],correctIndex:1}
},
{
  id:44, day:4, topic:"Declarative vs Imperative IaC",
  question:"A DevOps team can either write a script that performs a sequence of creation commands or describe the infrastructure it wants Terraform to maintain. Which approach is declarative, and what does idempotence mean in this setting?",
  answer:"Terraform's desired-state configuration is declarative: it describes the end state rather than every operation. Idempotence means repeatedly applying the same desired configuration should converge on the same intended state instead of creating duplicate or unintended changes.",

const state = {
  mode:"study",
  currentId:1,
  search:"",
  dayFilter:"all",
  statusFilter:"all",
  progress:{},
  revealed:{},
  collapsed:{},
  mcqCache:{},
  mcqSelected:{},
  mcqAnswered:{},
  examQueue:[],
  examIndex:0,
  examAnswers:{},
  examStarted:false,
  examFinished:false,
  theme:"light",
  xp:0, level:1, streak:0, bestStreak:0,
  badges:new Set(),
  activeToast:null,
  toastTimer:null
};

function byId(id){ return DATA.find(d=>d.id===id); }
function levelXpNeeded(level){ return level*150; }
function xpIntoLevel(){ const base=(state.level-1)*150; return state.xp-base; }
function xpPct(){ return Math.min(100, Math.round(xpIntoLevel()/150*100)); }

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

function showToast(title, sub, icon){
  state.activeToast = {title,sub,icon};
  render();
  if(state.toastTimer) clearTimeout(state.toastTimer);
  state.toastTimer = setTimeout(()=>{ state.activeToast=null; renderToastOnly(); }, 3000);
}
function renderToastOnly(){
  const host = document.getElementById("toast-host");
  host.innerHTML = state.activeToast ? toastHtml() : "";
}
function toastHtml(){
  const t = state.activeToast;
  return `<div class="toast"><div class="ic">${t.icon}</div><div><div class="t1">${t.title}</div><div class="t2">${t.sub}</div></div></div>`;
}

function addXP(amount){
  state.xp += amount;
  const newLevel = 1 + Math.floor(state.xp/150);
  if(newLevel > state.level){
    state.level = newLevel;
    showToast(`Level Up! Level ${state.level}`, "Keep going — new badges may unlock", "🚀");
  }
}

function checkBadges(){
  BADGES.forEach(b=>{
    if(!state.badges.has(b.id) && b.cond(state)){
      state.badges.add(b.id);
      setTimeout(()=>showToast(`Badge Unlocked: ${b.name}`, b.desc, b.icon), 350);
    }
  });
}

function handleAnswerResult(item, isCorrect){
  if(isCorrect){
    state.streak += 1;
    state.bestStreak = Math.max(state.bestStreak, state.streak);
    const bonus = Math.min(state.streak*2, 20);
    addXP(15 + bonus);
    state.progress[item.id] = 'know';
  } else {
    state.streak = 0;
    addXP(3);
    state.progress[item.id] = 'review';
  }
  checkBadges();
}

/* ============================= DIAGRAM ============================= */
function renderDiagram(d){
  if(!d) return "";
  if(d.type==="linear"){
    return `<div class="diagram">${d.steps.map((s,i)=>`<div class="dbox" data-n="${i+1}">${s}</div>${i<d.steps.length-1?'<div class="darrow">↓</div>':''}`).join("")}</div>`;
  }
  if(d.type==="tree"){
    return `<div class="diagram"><div class="dtree"><div class="dbox" data-n="0">${d.root}</div><div class="darrow">↓</div><div class="children">${d.children.map((c,i)=>`<div class="child"><div class="dbox alt" data-n="${i+1}">${c}</div></div>`).join("")}</div></div></div>`;
  }
  if(d.type==="compare"){
    return `<div class="diagram"><div class="dcompare">${d.tracks.map(t=>`<div class="dtrack"><div class="title">${t.title}</div>${t.steps.map((s,i)=>`<div class="dbox" data-n="${i+1}">${s}</div>${i<t.steps.length-1?'<div class="darrow">↓</div>':''}`).join("")}</div>`).join("")}</div></div>`;
  }
  if(d.type==="layers"){
    return `<div class="diagram"><div class="dlayers">${d.layers.map(l=>`<div class="dlayer"><b>${l.label}</b>${l.detail}</div>`).join("")}</div></div>`;
  }
  return "";
}

/* ============================= MCQ ============================= */
function getShuffledMCQ(item){
  if(!state.mcqCache[item.id]){
    const opts = item.mcq.options.map((text,i)=>({text, correct:i===item.mcq.correctIndex}));
    state.mcqCache[item.id] = shuffle(opts);
  }
  return state.mcqCache[item.id];
}
function selectMcqOption(itemId, idx){
  if(state.mcqAnswered[itemId]) return;
  state.mcqSelected[itemId] = idx;
  render();
}
function submitMcq(itemId){
  const item = byId(itemId);
  const sel = state.mcqSelected[itemId];
  if(sel===undefined) return;
  const opts = getShuffledMCQ(item);
  const isCorrect = opts[sel].correct;
  state.mcqAnswered[itemId] = true;
  state.revealed[itemId] = true;
  handleAnswerResult(item, isCorrect);
  render();
}
function renderMcqBlock(item, keyPrefix){
  const opts = getShuffledMCQ(item);
  const answered = !!state.mcqAnswered[item.id];
  const sel = state.mcqSelected[item.id];
  const letters = ["A","B","C","D"];
  let html = `<div class="mcq-list">`;
  opts.forEach((o,i)=>{
    let cls = "mcq-opt";
    if(!answered && sel===i) cls += " selected";
    if(answered){
      if(o.correct) cls += " correct-reveal";
      else if(sel===i) cls += " wrong-reveal";
      else cls += " dim";
    }
    html += `<button class="${cls}" ${answered?'':`onclick="selectMcqOption(${item.id},${i})"`}>
      <span class="optkey">${letters[i]}</span><span>${o.text}</span>
    </button>`;
  });
  html += `</div>`;
  if(!answered){
    html += `<div class="btnrow"><button class="btn primary" ${sel===undefined?'disabled':''} onclick="submitMcq(${item.id})">Submit Answer</button></div>`;
  } else {
    const isCorrect = opts[sel] ? opts[sel].correct : false;
    html += `<div class="result-banner ${isCorrect?'correct':'incorrect'}">
      ${isCorrect? '✅ Correct! Nicely done.' : '❌ Not quite — review the correct answer below.'}
      <span class="xpgain">+XP earned</span>
    </div>`;
  }
  return html;
}

    html += sectionWrap(`quick-${item.id}`, "Quick Answer &amp; Remember This", quickBlock(item)+rememberBlock(item), true, "⚡");

function onSearch(v){ state.search=v; render(); }

function setStatusFilter(v){ state.statusFilter = state.statusFilter===v? 'all': v; render(); }

function filteredList(){
  return DATA.filter(d=>{
    if(state.dayFilter!=='all' && d.day!==state.dayFilter) return false;
    if(state.statusFilter!=='all'){
      const st = state.progress[d.id];
      if(state.statusFilter==='none' && st) return false;
      if(state.statusFilter!=='none' && st!==state.statusFilter) return false;
    }
    if(state.search.trim()){
      const q = state.search.toLowerCase();
      const hay = (d.question+" "+d.topic+" "+d.quick).toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });
}

/* ============================= EXAM MODE (auto-graded MCQ) ============================= */
function startExam(){
  state.examQueue = shuffle(DATA.map(d=>d.id));
  state.examIndex = 0;
  state.examAnswers = {};
  state.examStarted = true;
  state.examFinished = false;
  render();
}
function examSelect(id, idx){
  if(state.examAnswers[id] !== undefined) return;
  state._examTemp = state._examTemp || {};
  state._examTemp[id] = idx;
  render();
}
function examSubmitCurrent(){
  const id = state.examQueue[state.examIndex];
  const idx = (state._examTemp||{})[id];
  if(idx===undefined) return;
  const item = byId(id);
  const opts = getShuffledMCQ(item);
  state.examAnswers[id] = { selected:idx, correct: opts[idx].correct };
  if(state.examIndex < state.examQueue.length-1){ state.examIndex++; }
  else { state.examFinished = true; DATA.forEach(d=>{ if(state.examAnswers[d.id]) handleAnswerResult(d, state.examAnswers[d.id].correct); }); }
  render();
}
function examReset(){ state.examStarted = false; state.examFinished = false; render(); }

function renderExam(){
  let html = "";
  if(!state.examStarted){
    html = renderTopbar("Exam Mode", `Randomized 4-option run through all ${DATA.length} questions. No hints while answering — full score and topic breakdown at the end.`, false, "⏱");
    html += `<div class="card" style="text-align:center; padding:44px 24px;">
      <h3 style="margin-bottom:8px;">🏁 Ready for a full run?</h3>
      <p style="color:var(--ink-soft); max-width:460px; margin:0 auto 18px;">All ${DATA.length} questions from Day 1–6 plus Exam Extension topics, each as a 4-option Quick Check, in random order with randomized answer positions. No explanations shown until the end — score, accuracy and topic-wise performance are calculated automatically.</p>
      <button class="btn primary" onclick="startExam()">Start Exam</button>
    </div>`;
    document.getElementById("main").innerHTML = html;
    return;
  }
  if(state.examFinished){
    const total = state.examQueue.length;
    const correct = Object.values(state.examAnswers).filter(a=>a.correct).length;
    const pct = Math.round(correct/total*100);
    const topics = {};
    state.examQueue.forEach(id=>{
      const it = byId(id);
      if(!topics[it.topic]) topics[it.topic] = {c:0,t:0};
      topics[it.topic].t++;
      if(state.examAnswers[id] && state.examAnswers[id].correct) topics[it.topic].c++;
    });
    html = renderTopbar("Exam Results", "Auto-graded performance summary for this run.", false, "🏁");
    html += `<div class="card">
      <div class="result-grid">
        <div class="result-box"><div class="num">${pct}%</div><div class="lbl">Score</div></div>
        <div class="result-box"><div class="num" style="color:var(--green)">${correct}</div><div class="lbl">Correct</div></div>
        <div class="result-box"><div class="num" style="color:var(--rust)">${total-correct}</div><div class="lbl">Incorrect</div></div>
      </div>
      <h4 style="margin-top:18px;">Topic-wise Performance</h4>
      ${Object.entries(topics).map(([topic,v])=>{
        const p = Math.round(v.c/v.t*100);
        return `<div class="topic-row"><span>${topic}</span><div style="display:flex; align-items:center; gap:10px;"><div class="tbar"><div style="width:${p}%"></div></div><span class="mono" style="width:60px; text-align:right;">${v.c}/${v.t}</span></div></div>`;
      }).join("")}
      <div class="btnrow" style="margin-top:20px;">
        <button class="btn primary" onclick="startExam()">Retake Exam (New Order)</button>
        <button class="btn ghost" onclick="examReset()">Exit Exam Mode</button>
      </div>
    </div>`;
    html += `<h3 style="margin-top:20px;">Review Incorrect Questions</h3>`;
    const wrong = state.examQueue.filter(id=>state.examAnswers[id] && !state.examAnswers[id].correct);
    if(!wrong.length){ html += `<div class="empty">🎉 No incorrect answers — perfect run!</div>`; }
    wrong.forEach(id=>{
      const it = byId(id);
      html += `<div class="card">
        <div class="eyebrow"><span class="pill day${it.day}">Day ${it.day}</span><span class="pill">${it.topic}</span></div>
        <div class="q-text">${it.question}</div>
        <div class="callout" style="border-left:3px solid var(--slate); background:var(--slate-soft);"><span class="lbl">Correct Answer</span>${it.answer}</div>
        ${realWorldBlock(it)}
        ${rememberBlock(it)}
        ${trapBlock(it)}
      </div>`;
    });
    document.getElementById("main").innerHTML = html;
    return;
  }

  const id = state.examQueue[state.examIndex];
  const item = byId(id);
  const opts = getShuffledMCQ(item);
  const sel = (state._examTemp||{})[id];
  const letters = ["A","B","C","D"];
  const pct = Math.round((state.examIndex)/state.examQueue.length*100);
  html = `<div class="exam-progress"><span>Question ${state.examIndex+1} of ${state.examQueue.length}</span><span>${pct}% complete</span></div>
  <div class="exam-bar"><div style="width:${pct}%"></div></div>`;
  html += `<div class="card">
    <div class="eyebrow"><span class="pill day${item.day}">Day ${item.day}</span><span class="pill">${item.topic}</span></div>
    <div class="q-text">${item.question}</div>
    <div class="callout" style="border-left:3px solid var(--violet); background:var(--violet-soft);"><span class="lbl">🎮 Quick Check</span>${item.mcq.question}</div>
    <div class="mcq-list">
      ${opts.map((o,i)=>`<button class="mcq-opt ${sel===i?'selected':''}" onclick="examSelect(${id},${i})">
        <span class="optkey">${letters[i]}</span><span>${o.text}</span>
      </button>`).join("")}
    </div>
    <div class="btnrow"><button class="btn primary" ${sel===undefined?'disabled':''} onclick="examSubmitCurrent()">${state.examIndex<state.examQueue.length-1?'Submit & Next →':'Submit & Finish'}</button></div>
  </div>`;
  document.getElementById("main").innerHTML = html;
}

/* ============================= MISTAKES ============================= */
function renderMistakes(){
  const mistakes = DATA.filter(d=>state.progress[d.id]==='review');
  let html = renderTopbar("My Mistakes", "Every question you marked or answered incorrectly — practice these until they turn green.", false, "⚠");
  if(!mistakes.length){ html += `<div class="empty"><div class="big">✓</div>No mistakes logged yet. Answer questions in Practice or Exam Mode to build this list.</div>`; }
  mistakes.forEach(item=>{
    html += `<div class="card">
      <div class="eyebrow"><span class="pill day${item.day}">Day ${item.day}</span><span class="pill">${item.topic}</span><span class="pill mono">Q${item.id}</span></div>
      <div class="q-text">${item.question}</div>
      <div class="callout" style="border-left:3px solid var(--slate); background:var(--slate-soft);"><span class="lbl">Correct Answer</span>${item.answer}</div>
      ${renderDiagram(item.diagram)}
      ${realWorldBlock(item)}
      ${rememberBlock(item)}
      ${trapBlock(item)}
      <div class="btnrow"><button class="btn primary" onclick="practiceAgain(${item.id})">Practice Again</button></div>
    </div>`;
  });
  document.getElementById("main").innerHTML = html;
}
function practiceAgain(id){
  state.currentId = id;
  state.revealed[id] = false;
  state.mcqAnswered[id] = false;
  state.mcqSelected[id] = undefined;
  delete state.mcqCache[id];
  state.mode = 'practice';
  render();
}

/* ============================= MAIN RENDER ============================= */
function render(){
  renderSidebar();
  if(state.mode==='study') renderStudyOrPractice('study');
  else if(state.mode==='practice') renderStudyOrPractice('practice');
  else if(state.mode==='revision') renderRevision();
  else if(state.mode==='visualize') renderVisualize();
  else if(state.mode==='exam') renderExam();
  else if(state.mode==='mistakes') renderMistakes();
  renderToastOnly();
}
render();
</script>
</body>
</html>
