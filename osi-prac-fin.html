<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OCI Foundations — Day 1–6 + Exam Extensions Visualizer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#131c27; --ink-soft:#4a5768;
  --paper:#f2f4f5; --panel:#ffffff; --line:#dde1e4;
  --amber:#b9822f; --amber-soft:#f4e6cd; --amber-glow:rgba(185,130,47,.35);
  --slate:#3468a0; --slate-soft:#dfeaf5; --slate-glow:rgba(52,104,160,.30);
  --violet:#6d54a8; --violet-soft:#e9e3f6;
  --green:#2f8a54; --green-soft:#dcf1e3; --green-glow:rgba(47,138,84,.35);
  --rust:#b8452f; --rust-soft:#f6ddd6; --rust-glow:rgba(184,69,47,.35);
  --gray:#8b93a0; --gray-soft:#e9eaec;
  --crimson:#a3315a; --crimson-soft:#f6dde7;
  --radius:8px;
  --shadow:0 1px 2px rgba(19,28,39,.06), 0 2px 18px rgba(19,28,39,.05);
}
[data-theme="dark"]{
  --ink:#eef1f4; --ink-soft:#a9b3c0;
  --paper:#0c1219; --panel:#131b25; --line:#26313d;
  --amber:#e0aa5e; --amber-soft:#2a2113; --amber-glow:rgba(224,170,94,.28);
  --slate:#7bb0dd; --slate-soft:#152230; --slate-glow:rgba(123,176,221,.25);
  --violet:#a893db; --violet-soft:#221c33;
  --green:#6fc493; --green-soft:#112a1c; --green-glow:rgba(111,196,147,.28);
  --rust:#e2846f; --rust-soft:#2c1712; --rust-glow:rgba(226,132,111,.25);
  --gray:#7c8695; --gray-soft:#1a222c;
  --crimson:#d97a9c; --crimson-soft:#2c1620;
  --shadow:0 1px 2px rgba(0,0,0,.35), 0 2px 22px rgba(0,0,0,.3);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:
    radial-gradient(900px 500px at 100% -10%, var(--slate-glow), transparent 60%),
    radial-gradient(700px 420px at -10% 0%, var(--amber-glow), transparent 55%),
    var(--paper);
  color:var(--ink);
  font-family:'Inter',system-ui,sans-serif;
  font-size:14.5px; line-height:1.55;
  transition:background .25s ease,color .25s ease;
}
h1,h2,h3,h4{font-family:'Space Grotesk',sans-serif; margin:0 0 8px; letter-spacing:-.01em;}
.mono{font-family:'IBM Plex Mono',monospace;}
::selection{background:var(--amber-soft);}
button{font-family:inherit; cursor:pointer;}
a{color:var(--slate);}
@keyframes fadeUp{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}
@keyframes popIn{0%{transform:scale(.85); opacity:0;} 100%{transform:scale(1); opacity:1;}}
@keyframes pulseGlow{0%,100%{box-shadow:0 0 0 0 var(--amber-glow);} 50%{box-shadow:0 0 0 6px transparent;}}
@keyframes slideIn{from{transform:translateX(120%); opacity:0;} to{transform:translateX(0); opacity:1;}}
@keyframes confetti{0%{transform:translateY(0) rotate(0); opacity:1;} 100%{transform:translateY(60px) rotate(240deg); opacity:0;}}
@keyframes shake{0%,100%{transform:translateX(0);} 25%{transform:translateX(-5px);} 75%{transform:translateX(5px);}}

/* ---------- SHELL ---------- */
#app{display:flex; min-height:100vh;}
#sidebar{
  width:292px; min-width:292px; background:var(--panel); border-right:1px solid var(--line);
  padding:18px 14px 24px; position:sticky; top:0; height:100vh; overflow-y:auto;
}
#main{flex:1; min-width:0; padding:22px 34px 70px; position:relative;}
@media (max-width:900px){
  #app{flex-direction:column;}
  #sidebar{width:100%; min-width:0; height:auto; position:relative; border-right:none; border-bottom:1px solid var(--line);}
  #main{padding:16px;}
}

.brand{display:flex; align-items:center; gap:10px; padding:4px 6px 16px; border-bottom:1px solid var(--line); margin-bottom:14px;}
.brand .mark{
  width:36px; height:36px; border-radius:9px; background:linear-gradient(155deg,var(--amber),var(--violet) 60%,var(--slate));
  display:flex; align-items:center; justify-content:center; color:#fff; font-family:'Space Grotesk'; font-weight:700; font-size:12.5px;
  flex-shrink:0; box-shadow:0 3px 10px var(--amber-glow);
}
.brand .name{font-family:'Space Grotesk'; font-weight:600; font-size:15px; line-height:1.2;}
.brand .sub{font-size:11px; color:var(--ink-soft); margin-top:1px;}
.theme-toggle{
  margin-left:auto; width:30px; height:30px; border-radius:8px; border:1px solid var(--line); background:var(--paper);
  display:flex; align-items:center; justify-content:center; color:var(--ink-soft); font-size:14px;
}

/* gamification hud */
.hud{margin:14px 6px; padding:13px; border-radius:10px; border:1px solid var(--line); background:linear-gradient(160deg, var(--panel), var(--paper)); position:relative; overflow:hidden;}
.hud-top{display:flex; align-items:center; gap:10px; margin-bottom:10px;}
.level-badge{
  width:38px; height:38px; border-radius:50%; background:conic-gradient(var(--amber) calc(var(--xppct)*1%), var(--gray-soft) 0);
  display:flex; align-items:center; justify-content:center; flex-shrink:0; position:relative;
}
.level-badge::after{content:""; position:absolute; inset:4px; border-radius:50%; background:var(--panel);}
.level-badge span{position:relative; z-index:1; font-family:'Space Grotesk'; font-weight:700; font-size:12px;}
.hud-title{font-family:'Space Grotesk'; font-weight:700; font-size:13.5px;}
.hud-sub{font-size:10.5px; color:var(--ink-soft); font-family:'IBM Plex Mono';}
.xpbar{height:6px; border-radius:4px; background:var(--gray-soft); overflow:hidden; margin:8px 0;}
.xpbar>div{height:100%; background:linear-gradient(90deg,var(--amber),var(--violet)); transition:width .4s ease;}
.hud-row{display:flex; justify-content:space-between; align-items:center; font-size:11.5px; color:var(--ink-soft);}
.streak{display:flex; align-items:center; gap:5px; font-family:'IBM Plex Mono'; font-weight:600; color:var(--ink);}
.streak.hot{color:var(--rust); animation:pulseGlow 1.4s infinite;}

.ring-wrap{display:flex; align-items:center; gap:12px; margin:10px 6px 4px;}
.ring{
  width:58px; height:58px; border-radius:50%; flex-shrink:0; position:relative;
  background:conic-gradient(var(--green) calc(var(--pct)*1%), var(--gray-soft) 0);
}
.ring::after{content:""; position:absolute; inset:7px; border-radius:50%; background:var(--panel);}
.ring b{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-family:'Space Grotesk'; font-size:13px; z-index:1;}
.ring-legend{font-size:11.5px; color:var(--ink-soft); line-height:1.6;}
.ring-legend b{color:var(--ink);}

.badges-row{display:flex; flex-wrap:wrap; gap:6px; margin:10px 6px;}
.badge-chip{
  width:30px; height:30px; border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:15px;
  background:var(--gray-soft); border:1px solid var(--line); opacity:.3; filter:grayscale(1);
}
.badge-chip.unlocked{opacity:1; filter:none; background:var(--amber-soft); border-color:var(--amber); box-shadow:0 0 0 2px var(--amber-glow);}

.nav-label{font-size:10.5px; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-soft); font-weight:600; margin:16px 6px 8px;}
.nav-btn{
  width:100%; text-align:left; background:none; border:none; padding:9px 10px; border-radius:7px; font-size:13.5px;
  color:var(--ink); display:flex; align-items:center; gap:9px; font-weight:500; transition:background .12s;
}
.nav-btn:hover{background:var(--gray-soft);}
.nav-btn.active{background:linear-gradient(90deg,var(--amber-soft),transparent); color:var(--amber); font-weight:700; box-shadow:inset 2px 0 0 var(--amber);}
.nav-btn .ic{width:16px; text-align:center; font-size:13px; opacity:.9;}

.qnav{display:grid; grid-template-columns:repeat(5,1fr); gap:6px; margin:8px 6px;}
.qdot{
  aspect-ratio:1; border-radius:7px; border:1px solid var(--line); background:var(--paper);
  display:flex; align-items:center; justify-content:center; font-family:'IBM Plex Mono'; font-size:11px; color:var(--ink-soft);
  transition:transform .1s;
}
.qdot:hover{border-color:var(--slate); transform:scale(1.06);}
.qdot.current{outline:2px solid var(--slate); outline-offset:1px;}
.qdot.know{background:var(--green-soft); color:var(--green); border-color:var(--green);}
.qdot.review{background:var(--rust-soft); color:var(--rust); border-color:var(--rust);}

/* ---------- TOPBAR ---------- */
.topbar{display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom:20px; flex-wrap:wrap;}
.topbar h2{font-size:20px; display:flex; align-items:center; gap:8px;}
.topbar .desc{color:var(--ink-soft); font-size:13px; margin-top:2px;}
.search-wrap{display:flex; gap:8px; align-items:center; flex-wrap:wrap;}
.search-input{border:1px solid var(--line); background:var(--panel); border-radius:8px; padding:8px 12px; font-size:13px; color:var(--ink); width:210px;}
.filter-chip{border:1px solid var(--line); background:var(--panel); border-radius:20px; padding:6px 12px; font-size:12px; color:var(--ink-soft);}
.filter-chip.on{background:var(--slate-soft); border-color:var(--slate); color:var(--slate); font-weight:700;}

/* ---------- CARD ---------- */
.card{background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:24px 26px; box-shadow:var(--shadow); margin-bottom:16px; animation:fadeUp .28s ease;}
.eyebrow{font-family:'IBM Plex Mono'; font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--slate); margin-bottom:10px; display:flex; gap:8px; align-items:center; flex-wrap:wrap;}
.pill{display:inline-block; font-size:10.5px; padding:3px 9px; border-radius:20px; background:var(--gray-soft); color:var(--ink-soft); font-family:'IBM Plex Mono'; letter-spacing:.03em;}
.pill.day1{background:var(--slate-soft); color:var(--slate);}
.pill.day2{background:var(--amber-soft); color:var(--amber);}
.pill.day3{background:var(--violet-soft); color:var(--violet);}
.pill.day4{background:var(--green-soft); color:var(--green);}
.pill.day5{background:var(--rust-soft); color:var(--rust);}
.pill.day6{background:var(--gray-soft); color:var(--ink-soft);}
.pill.day7{background:var(--crimson-soft); color:var(--crimson);}
.pill.xp{background:var(--violet-soft); color:var(--violet);}

.q-text{font-size:18px; font-weight:600; line-height:1.5; margin-bottom:16px; font-family:'Space Grotesk';}

/* MCQ */
.mcq-list{display:flex; flex-direction:column; gap:9px; margin:14px 0 6px;}
.mcq-opt{
  border:1.5px solid var(--line); background:var(--paper); border-radius:9px; padding:12px 14px; font-size:13.5px; text-align:left;
  display:flex; align-items:center; gap:11px; transition:border-color .12s, background .12s, transform .08s;
}
.mcq-opt:hover:not(.locked){border-color:var(--slate); transform:translateX(2px);}
.mcq-opt.selected{border-color:var(--slate); background:var(--slate-soft); font-weight:600;}
.mcq-opt .optkey{
  width:24px; height:24px; border-radius:7px; background:var(--gray-soft); color:var(--ink-soft); font-family:'IBM Plex Mono'; font-weight:700;
  font-size:12px; display:flex; align-items:center; justify-content:center; flex-shrink:0;
}
.mcq-opt.selected .optkey{background:var(--slate); color:#fff;}
.mcq-opt.correct-reveal{border-color:var(--green); background:var(--green-soft); font-weight:600;}
.mcq-opt.correct-reveal .optkey{background:var(--green); color:#fff;}
.mcq-opt.wrong-reveal{border-color:var(--rust); background:var(--rust-soft); animation:shake .35s;}
.mcq-opt.wrong-reveal .optkey{background:var(--rust); color:#fff;}
.mcq-opt.dim{opacity:.55;}

.result-banner{
  border-radius:10px; padding:14px 16px; margin:14px 0; font-weight:700; font-size:14px; display:flex; align-items:center; gap:10px;
  animation:popIn .25s ease;
}
.result-banner.correct{background:var(--green-soft); color:var(--green); box-shadow:0 0 0 1px var(--green);}
.result-banner.incorrect{background:var(--rust-soft); color:var(--rust); box-shadow:0 0 0 1px var(--rust);}
.result-banner .xpgain{margin-left:auto; font-family:'IBM Plex Mono'; font-size:12px; background:rgba(255,255,255,.35); padding:3px 9px; border-radius:20px;}

.btn{border:1px solid var(--line); background:var(--panel); color:var(--ink); padding:10px 18px; border-radius:8px; font-size:13px; font-weight:700; display:inline-flex; align-items:center; gap:7px; transition:transform .08s, box-shadow .15s;}
.btn:hover:not(:disabled){transform:translateY(-1px); box-shadow:0 3px 10px rgba(0,0,0,.08);}
.btn.primary{background:linear-gradient(120deg,var(--ink),#000 130%); color:var(--paper); border-color:var(--ink);}
[data-theme="dark"] .btn.primary{background:linear-gradient(120deg,var(--amber),#c88a3f); color:#1a1204; border-color:var(--amber);}
.btn.ghost{background:none;}
.btn.know{background:var(--green-soft); border-color:var(--green); color:var(--green);}
.btn.review{background:var(--rust-soft); border-color:var(--rust); color:var(--rust);}
.btn:disabled{opacity:.4; cursor:not-allowed; transform:none;}
.btnrow{display:flex; gap:10px; flex-wrap:wrap; margin-top:10px; align-items:center;}

.section{border-top:1px solid var(--line); margin-top:18px; padding-top:16px;}
.section-head{display:flex; align-items:center; gap:8px; cursor:pointer; user-select:none;}
.section-head h4{font-size:13.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-soft); flex:1; display:flex; align-items:center; gap:7px;}
.section-head .chev{font-size:11px; color:var(--gray); transition:transform .15s;}
.section.collapsed .section-head .chev{transform:rotate(-90deg);}
.section.collapsed .section-body{display:none;}
.section-body{margin-top:10px; animation:fadeUp .2s ease;}

.theory-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
@media(max-width:640px){.theory-grid{grid-template-columns:1fr;}}
.theory-box{background:var(--paper); border:1px solid var(--line); border-radius:9px; padding:13px 15px; transition:border-color .15s;}
.theory-box:hover{border-color:var(--slate);}
.theory-box .lbl{font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--slate); font-weight:700; margin-bottom:5px; display:flex; gap:6px; align-items:center;}

.callout{border-radius:9px; padding:13px 16px; border:1px solid var(--line); background:var(--paper); margin-top:10px;}
.callout.quick{border-left:3px solid var(--slate); background:var(--slate-soft);}
.callout.remember{border-left:3px solid var(--amber); background:var(--amber-soft);}
.callout.trap{border-left:3px solid var(--rust); background:var(--rust-soft);}
.callout.real{border-left:3px solid var(--violet); background:var(--violet-soft);}
.callout.correct-box{border-left:3px solid var(--green); background:var(--green-soft);}
.callout .lbl{font-weight:700; font-size:12.5px; margin-bottom:5px; display:flex; align-items:center; gap:6px;}
.remember-line{font-family:'IBM Plex Mono'; font-size:13px; margin:3px 0;}

/* diagram */
.diagram{display:flex; flex-direction:column; align-items:center; gap:0; padding:16px 6px;}
.dbox{
  border:1px solid var(--slate); background:var(--slate-soft); color:var(--ink); font-family:'IBM Plex Mono'; font-size:12.5px;
  padding:10px 18px; border-radius:8px; text-align:center; min-width:170px; max-width:360px; font-weight:600;
  box-shadow:0 2px 8px rgba(0,0,0,.04); position:relative;
}
.dbox::before{content:attr(data-n); position:absolute; left:-9px; top:-9px; width:20px; height:20px; border-radius:50%; background:var(--slate); color:#fff; font-size:10px; display:flex; align-items:center; justify-content:center; font-weight:700;}
.dbox.alt{border-color:var(--amber); background:var(--amber-soft);}
.dbox.alt::before{background:var(--amber);}
.darrow{color:var(--gray); font-size:16px; margin:3px 0;}
.dtree{display:flex; flex-direction:column; align-items:center;}
.dtree .children{display:flex; gap:22px; margin-top:10px; flex-wrap:wrap; justify-content:center;}
.dtree .child{display:flex; flex-direction:column; align-items:center;}
.dcompare{display:flex; gap:28px; justify-content:center; flex-wrap:wrap; width:100%;}
.dtrack{display:flex; flex-direction:column; align-items:center;}
.dtrack .title{font-family:'IBM Plex Mono'; font-weight:700; font-size:12px; color:var(--ink-soft); margin-bottom:8px; text-transform:uppercase; letter-spacing:.04em;}
.dlayers{display:flex; flex-direction:column; align-items:stretch; gap:0; width:100%; max-width:440px;}
.dlayer{border:1px solid var(--line); border-radius:8px; padding:11px 15px; margin-bottom:8px; font-family:'IBM Plex Mono'; font-size:12.5px; background:var(--paper); border-left:3px solid var(--violet);}
.dlayer b{display:block; font-size:11px; color:var(--violet); text-transform:uppercase; letter-spacing:.04em; margin-bottom:2px;}

.explain-simple{background:var(--paper); border:1px dashed var(--line); border-radius:9px; padding:13px 15px; margin-top:10px; font-size:13.5px;}
.explain-simple .lbl{font-weight:700; color:var(--slate); font-size:11.5px; text-transform:uppercase; margin-bottom:4px;}

/* revision */
.rev-card{background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:16px 18px; margin-bottom:12px; transition:box-shadow .15s;}
.rev-card:hover{box-shadow:var(--shadow);}
.rev-flow{font-family:'IBM Plex Mono'; font-size:12.5px; color:var(--ink-soft); margin:8px 0; line-height:1.9;}
.rev-flow b{color:var(--ink);}

/* exam */
.exam-progress{font-family:'IBM Plex Mono'; font-size:12px; color:var(--ink-soft); margin-bottom:10px; display:flex; justify-content:space-between;}
.exam-bar{height:5px; border-radius:4px; background:var(--gray-soft); overflow:hidden; margin-bottom:14px;}
.exam-bar>div{height:100%; background:linear-gradient(90deg,var(--slate),var(--violet));}
.result-grid{display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px; margin:16px 0;}
@media(max-width:640px){.result-grid{grid-template-columns:1fr;}}
.result-box{border:1px solid var(--line); border-radius:10px; padding:16px; text-align:center; background:var(--paper);}
.result-box .num{font-family:'Space Grotesk'; font-size:28px; font-weight:700;}
.result-box .lbl{font-size:11.5px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.04em; margin-top:2px;}
.topic-row{display:flex; justify-content:space-between; align-items:center; padding:9px 0; border-bottom:1px solid var(--line); font-size:13px;}
.topic-row:last-child{border-bottom:none;}
.tbar{width:120px; height:6px; border-radius:4px; background:var(--gray-soft); overflow:hidden;}
.tbar>div{height:100%; background:linear-gradient(90deg,var(--green),var(--slate));}

.empty{text-align:center; padding:60px 20px; color:var(--ink-soft);}
.empty .big{font-size:34px; margin-bottom:10px;}

/* toast */
#toast-host{position:fixed; top:20px; right:20px; z-index:999; display:flex; flex-direction:column; gap:10px;}
.toast{
  background:var(--panel); border:1px solid var(--amber); border-radius:10px; padding:13px 18px; box-shadow:var(--shadow);
  display:flex; align-items:center; gap:12px; min-width:240px; animation:slideIn .3s ease;
}
.toast .ic{font-size:24px;}
.toast .t1{font-weight:700; font-size:13.5px;}
.toast .t2{font-size:11.5px; color:var(--ink-soft);}

/* confetti */
.confetti-wrap{position:relative; height:0;}
.confetti-piece{position:absolute; width:6px; height:6px; border-radius:1px; animation:confetti .8s ease forwards;}
</style>
</head>
<body data-theme="light">
<div id="app">
  <aside id="sidebar"></aside>
  <main id="main"></main>
</div>
<div id="toast-host"></div>

<script>
/* ============================= DATA ============================= */
const DATA = [
    {
  id:1, day:1, topic:"IAM Policy",
  question:"A project team needs read access to Object Storage in only its Finance compartment. The architect wants to express the grant using OCI policy grammar and also needs to know what happens when an employee belongs to several groups with different grants. What policy structure should be used, and how are the resulting permissions combined?",
  answer:"Every OCI policy statement follows the fixed grammar: Allow <group> to <verb> <resource-type> in compartment <compartment-name>. The four components, in order, are: (1) the Group the policy applies to, (2) the Verb / permission level (inspect, read, use, manage), (3) the Resource-type being accessed, and (4) the Location (compartment or tenancy) where it applies. When a user belongs to several groups, OCI evaluates ALL applicable policies together and grants the union of every permission — access is additive, not restrictive, and there is no explicit 'deny' statement in OCI policy language.",
  explanation:"OCI's policy language is deliberately simple and reads almost like English: Allow group <G> to <verb> <resource-type> in compartment <C>. Because there is no 'deny' construct, the system is purely additive — if any policy statement, through any group membership, grants a permission, the user has it.",
  theory:{ what:"An IAM policy is a written statement that grants a group of users a defined level of access to a defined set of resources in a defined location.", why:"Policies are how OCI enforces least-privilege access control — without one, no group has any access to any resource, by default.", how:"OCI parses the statement into WHO (group), WHAT (verb), WHICH (resource-type), and WHERE (compartment). At evaluation time, OCI collects every policy statement that matches the user through any group memberships and merges them into one effective permission set.", example:"A user is in both 'NetworkAdmins' (manage virtual-network-family in Prod) and 'Auditors' (inspect all-resources in Prod). The user effectively gets manage on networking AND inspect on everything else in Prod." },
  quick:"An IAM policy statement always reads: Allow GROUP to VERB RESOURCE-TYPE in compartment COMPARTMENT — and multiple group grants are always additive (union), never restrictive.",
  remember:["WHO → WHAT → WHICH → WHERE","Multiple groups = MORE access, never less"],
  trap:"Students often assume OCI policies can 'deny' access like explicit-deny statements elsewhere. OCI has no deny statement — if a user is in ANY group with a matching Allow, they have that access.",
  wrongOptionsNote:"Common wrong answers swap the order (compartment first) or claim the most restrictive policy wins — OCI always takes the most permissive combined result.",
  diagram:{type:"linear", steps:["WHO — Group","WHAT — Verb (inspect / read / use / manage)","WHICH — Resource-Type","WHERE — Compartment"]},
  examAnswer:"Policy grammar: Allow <group> to <verb> <resource-type> in compartment <compartment>. With multiple group memberships, OCI grants the union of all permissions — access is cumulative, no explicit deny.",
  realWorld:"Think of an office keycard system: a policy is like a rule that says 'Marketing badges open Floor 3 meeting rooms.' If you carry badges from two departments, you can use whichever badge lets you through — more badges always mean more access, never less.",
  mcq:{ question:"When a user belongs to multiple OCI groups, how does OCI determine their effective permissions?", options:["Only the most restrictive policy applies","The permissions are combined — the user gets the union of all group permissions","Only the last-created policy is evaluated","OCI requires an explicit deny statement to block conflicting access"], correctIndex:1 }
},
{
  id:2, day:1, topic:"Compartments",
  question:"A startup has one compartment containing development, test, and production resources. As the environment grows, different teams need separate administration and cost visibility. Propose a compartment hierarchy that provides isolation without creating unnecessary administrative complexity.",
  answer:"Replace the single flat compartment with a dedicated compartment per environment — Production, Development, and Testing — nested under the tenancy. Each compartment gets its own IAM policies, budgets, and tags, so access, cost, and change control are scoped per environment instead of shared.",
  explanation:"Compartments are OCI's primary logical boundary for organizing resources. Splitting Dev/Test/Prod into separate compartments means a policy mistake in Development can never accidentally expose Production, and cost/quota reporting becomes environment-specific.",
  theory:{ what:"A compartment is a logical, tenancy-wide container used to organize and isolate OCI resources for security, billing, and administrative purposes.", why:"It lets an organization apply different access policies, budgets, and quotas to different parts of the business without needing separate tenancies.", how:"Compartments form a hierarchy under the root (tenancy) compartment. IAM policies are written to grant access scoped to one compartment (and optionally its sub-compartments).", example:"Create Production, Development and Testing compartments. A policy grants 'DevTeam' manage access only in Development — they cannot touch Production even by mistake." },
  quick:"Isolate environments with one compartment per environment (Prod / Dev / Test) so access, cost, and governance can be scoped independently.",
  remember:["Compartment = Isolation boundary","1 Compartment ≈ 1 Environment or Business Unit"],
  trap:"Students confuse compartments with regions or VCNs. A compartment is a logical/administrative boundary — it has no geography and no networking behavior of its own.",
  wrongOptionsNote:"A wrong recommendation would be to use tags alone instead of separate compartments — tags help with cost reporting but cannot scope IAM policy access the way compartments do.",
  diagram:{type:"tree", root:"Tenancy (Root Compartment)", children:["Production","Development","Testing"]},
  examAnswer:"Create separate compartments for Production, Development and Testing under the tenancy, each with its own IAM policies, budgets and tags, so access and cost are isolated per environment.",
  realWorld:"Like separate wings in a hospital — Cardiology, Pediatrics, Radiology — each with its own staff badges and its own budget, so a mistake in Radiology can't touch the Pediatrics ward.",
  mcq:{ question:"What is the recommended way to isolate Dev, Test and Prod resources in OCI?", options:["Use tags only and keep everything in one compartment","Create separate compartments per environment","Use separate tenancies for each environment","Use separate regions for each environment"], correctIndex:1 }
},
{
  id:3, day:1, topic:"Least Privilege",
  question:"A platform team discovers that application developers can administer resources across the entire tenancy, although their jobs only require access to one application environment. How should the IAM design be changed to follow least privilege?",
  answer:"Apply the principle of least privilege: remove these users from the Administrators group, identify the exact resource-types and compartments each person's job actually needs, create narrowly-scoped groups, write compartment-scoped policies, and add users only to relevant groups.",
  explanation:"Tenancy-wide admin rights mean a mistake or compromised credential can affect the entire tenancy. Replacing broad Administrator membership with function-specific, compartment-scoped groups dramatically reduces the blast radius of any error or breach.",
  theory:{ what:"Least privilege is the security principle that a user or system should be granted only the minimum access required to perform its function — nothing more.", why:"It limits damage from mistakes, insider misuse, or a compromised account, and makes audits far simpler since access maps to job function.", how:"Identify actual tasks, map them to the minimum verbs/resource-types/compartments needed, create purpose-built groups, write scoped policies, then remove unnecessary broad memberships.", example:"A backup operator only needs 'use' access to object-storage in one compartment — they should never be in the tenancy Administrators group just for convenience." },
  quick:"Replace broad Administrator access with narrowly scoped, function-specific groups and compartment-level policies — grant only what the job requires.",
  remember:["Least Privilege = Just Enough Access","Admins group = last resort, not default"],
  trap:"A common wrong instinct is to leave admin access 'for convenience' or only add restrictions on top without removing Administrators membership — least privilege requires actually removing the excess access.",
  wrongOptionsNote:"Simply auditing access without changing group membership does not solve the problem — the fix requires actual removal from Administrators and creation of scoped groups/policies.",
  diagram:{type:"linear", steps:["Broad Tenancy-Admin Access","Identify actual job function","Create narrowly-scoped Group","Write compartment-scoped Policy","Remove user from Administrators"]},
  examAnswer:"Apply least privilege: remove tenancy-wide admin rights, create job-specific groups scoped to the needed compartments/resource-types, and assign users only to those groups instead of Administrators.",
  realWorld:"A hotel doesn't give every staff member a master key. Housekeeping gets keys only to the floors they clean, not the manager's office — reducing what can go wrong if a key is lost.",
  mcq:{ question:"What is the correct IAM fix when users have unnecessary tenancy-wide admin access?", options:["Leave access as is but monitor it more closely","Remove them from Administrators and assign scoped, function-based groups","Add MFA but keep Administrator membership","Move all users into a single generic group"], correctIndex:1 }
},
{
  id:4, day:1, topic:"Tagging & Cost Governance",
  question:"Finance cannot reliably attribute OCI charges to individual business units because many resources were created without a consistent metadata standard. What tagging and governance process should the organization introduce so that spending can be allocated reliably?",
  answer:"Define a standard Tag Namespace (e.g., 'Business-Unit', 'Cost-Center'), enforce mandatory tagging at resource creation using tag defaults and/or policies, and require every resource to carry these tags. Cost Analysis can then be filtered and grouped by tag so every dollar maps back to a business unit.",
  explanation:"Tags are OCI's mechanism for adding business-relevant metadata to otherwise anonymous cloud resources. Without mandatory, standardized tagging, untagged resources become 'unattributed spend' that no business unit can be held accountable for.",
  theory:{ what:"A tag is a key-value label attached to an OCI resource; a tag namespace is a governed set of tag keys enforced across the tenancy.", why:"Tags let cost, usage, and ownership be sliced by business dimension rather than only by compartment or resource type.", how:"Define a tag namespace and required keys, set tag defaults so new resources auto-inherit them, and use policies to require tags before creation is allowed. Cost Analysis then groups spend by tag value.", example:"Every compute instance must carry a 'Cost-Center' tag. Cost Analysis is filtered by Cost-Center to show exactly how much each department spent last month." },
  quick:"Enforce a mandatory tag namespace (e.g., Cost-Center) with tag defaults, and use Cost Analysis grouped by tag to attribute spend to a business unit.",
  remember:["Tags = Business Metadata","No Tag = No Accountability"],
  trap:"Students sometimes suggest compartments alone will fix this — compartments give structural isolation, but if multiple business units share a compartment, only tags can attribute cost at finer, cross-cutting granularity.",
  wrongOptionsNote:"Relying only on manual, ad-hoc tagging without a namespace and defaults will not solve recurring gaps — tag defaults and enforcement are required for consistency.",
  diagram:{type:"linear", steps:["Resource Created","Mandatory Tag Applied (Cost-Center)","Tag Namespace Enforced Tenancy-wide","Cost Analysis grouped by Tag","Spend attributed to Business Unit"]},
  examAnswer:"Create a governed tag namespace, apply tag defaults so all new resources are automatically tagged, and enforce tagging via policy. Use Cost Analysis grouped by tag to attribute spend to each business unit.",
  realWorld:"Like labeling every expense receipt with a department name before submitting it to finance — without the label, accounting has no idea which team to bill.",
  mcq:{ question:"How should an organization ensure all cloud spend can be attributed to a business unit?", options:["Rely on compartment names alone","Enforce mandatory cost-tracking tags with tag defaults","Manually track spend in a spreadsheet","Disable Cost Analysis and use invoices only"], correctIndex:1 }
},
{
  id:5, day:1, topic:"Region / AD / Fault Domain",
  question:"An architect is placing two application servers for resilience and wants to understand the physical isolation offered by OCI. How do Region, Availability Domain, and Fault Domain differ, and which placement level protects two instances from a localized hardware problem within one AD?",
  answer:"A Region is a localized geographic area containing one or more data centers. An Availability Domain (AD) is one or more independent data centers within a region, isolated from other ADs by power and networking failures. A Fault Domain (FD) is a logical grouping of hardware inside a single AD, isolating instances from localized hardware failures. To protect against a localized hardware failure inside one AD, distribute instances across different Fault Domains.",
  explanation:"These three levels form OCI's physical hierarchy from broadest to narrowest: Region → Availability Domain → Fault Domain → the compute instance. Fault Domains protect against failures smaller than a whole data center, such as a failed rack or power supply, while keeping instances in the same AD for low-latency connectivity.",
  theory:{ what:"Region = geographic location; Availability Domain = independent data centers inside a region; Fault Domain = hardware grouping inside a single AD.", why:"This hierarchy lets architects choose the right blast-radius to protect against: region failure, data-center failure, or a single-rack/hardware failure.", how:"Deploy across multiple Regions for disaster recovery; deploy across multiple ADs within a region for data-center-level outages; deploy across multiple Fault Domains within a single AD for rack/hardware-level failures.", example:"A 3-node database cluster is placed one instance per Fault Domain inside a single AD — if one rack loses power, only one node goes down." },
  quick:"Region = geography, AD = independent data centers, FD = hardware grouping inside an AD. Use Fault Domains to protect against a localized hardware failure within one AD.",
  remember:["Region = Geography","AD = Data Center Domain","FD = Hardware Failure Domain"],
  trap:"A common mistake is answering 'use multiple Availability Domains' for a hardware-level failure — multiple ADs protect against data-center-level outages, not a single rack/hardware failure.",
  wrongOptionsNote:"Confusing Region with Availability Domain is also common — a Region can contain multiple ADs, but a Region itself is a geographic boundary, not an instance-placement resiliency unit.",
  diagram:{type:"linear", steps:["Region (Geography)","Availability Domain (Independent Data Center)","Fault Domain (Hardware Grouping)","Compute Instance"]},
  examAnswer:"Region = geographic area; Availability Domain = independent data center(s); Fault Domain = hardware grouping within one AD. Place instances across different Fault Domains to protect against a localized hardware failure.",
  realWorld:"A Region is like a country; an Availability Domain is like a separate city's data center within that country; a Fault Domain is like a separate power circuit inside one data center — losing one circuit doesn't take down the whole building.",
  mcq:{ question:"Which infrastructure level should you use to protect instances from a single rack/hardware failure inside one Availability Domain?", options:["Region","Availability Domain","Fault Domain","Compartment"], correctIndex:2 }
},
{
  id:6, day:1, topic:"Identity Management Design",
  question:"A new OCI tenancy has separate operations, development, and audit teams. Propose an identity design using users, groups, roles/permissions, and policies so access is assigned to teams rather than individually maintained for every employee.",
  answer:"Organize people into Groups based on job function. Organize resources into Compartments based on environment/business-unit. Write Policies that grant each Group specific verbs on specific resource-types within specific compartments. Use Dynamic Groups for non-human/instance-based access, and Identity Domains for centralized authentication (federation/SSO/MFA).",
  explanation:"OCI IAM is built from five core building blocks: Users, Groups, Compartments, Policies, and Dynamic Groups — all managed within an Identity Domain. Users never get permissions individually; they inherit permissions purely through group membership.",
  theory:{ what:"OCI IAM is the framework of Users, Groups, Compartments and Policies used to authenticate identities and authorize access to resources.", why:"Centralizing identity design around groups and compartments keeps access consistent, auditable, and easy to change.", how:"Create Users, place them into Groups by function, organize resources into Compartments, write Policies connecting Groups to Compartments. Enable MFA and federate through Identity Domains; use Dynamic Groups for instances/services needing API access.", example:"New hires join the 'Developers' group, which has a policy granting 'use' on compute instances in Development only — no individual policy is written per person." },
  quick:"Design identity around Users → Groups → Policies → Compartments, using Identity Domains for authentication/MFA and Dynamic Groups for non-human access.",
  remember:["Users join Groups","Groups get Policies","Policies target Compartments"],
  trap:"Students sometimes suggest granting permissions directly to individual users. OCI IAM policies can only reference Groups (and Dynamic Groups), not individual users.",
  wrongOptionsNote:"Skipping compartments and applying all policies tenancy-wide defeats the purpose of scoped access.",
  diagram:{type:"linear", steps:["Users","Groups (by job function)","Policies (verb + resource-type)","Compartments (scope)"]},
  examAnswer:"Organize users into function-based Groups, resources into Compartments, connect them with scoped Policies. Use Identity Domains for authentication/MFA/federation and Dynamic Groups for instance-based access.",
  realWorld:"Like a company assigning employees to departments (Groups) instead of writing a unique security clearance for every single employee — much easier to manage at scale.",
  mcq:{ question:"In OCI IAM, how are permissions ultimately granted to a user?", options:["Directly to the individual user","Through the group(s) the user belongs to","Through their email domain","Through the compartment they log into"], correctIndex:1 }
},
{
  id:7, day:2, topic:"Budget vs Quota",
  question:"A cloud team wants one control to warn management when spending approaches a monthly financial threshold and another control to restrict how many resources a compartment can consume. Which OCI mechanisms provide these two controls, and what happens when each threshold is reached?",
  answer:"A Budget tracks and controls spending against a compartment or tag, and when its threshold is reached it sends an alert notification — it does not block resource creation. A Quota controls resource consumption at a compartment level, and when its limit is reached, it actively restricts further creation of that resource-type.",
  explanation:"Budgets and Quotas solve two different governance problems that are frequently confused: Budgets are financial monitoring/alerting (reactive), while Quotas are a hard, preventive resource-consumption control (proactive/restrictive).",
  theory:{ what:"A Budget monitors cost against a compartment or cost-tracking tag. A Quota restricts how many of a resource-type a compartment can consume.", why:"Budgets give financial visibility and early-warning alerts; Quotas give hard, technical guardrails to prevent runaway resource sprawl.", how:"A Budget is configured with a monthly amount and alert thresholds (e.g. 80%, 100%) that trigger notifications. A Quota is written in quota-policy syntax specifying a maximum count of a resource-type; once reached, OCI blocks further creation.", example:"A team sets a Budget of $5,000/month with an 80% alert. Separately, a Quota limits a compartment to 10 compute instances — the 11th creation is blocked outright." },
  quick:"Budget = money (alerts only). Quota = resource consumption (actively blocks creation once the limit is reached).",
  remember:["Budget = MONEY, sends an Alert","Quota = RESOURCES, blocks Creation"],
  trap:"The most common trap is assuming a Budget can stop resource creation like a Quota does — a Budget only notifies; it never technically prevents spending or creation.",
  wrongOptionsNote:"Confusing a Quota with a Service Limit is also a classic trap — a Quota is a customer-configurable restriction within the Oracle-imposed Service Limit.",
  diagram:{type:"compare", tracks:[ {title:"Budget", steps:["Money / Spending","Threshold (e.g., 80%)","Alert Notification Sent"]}, {title:"Quota", steps:["Resource Consumption","Quota Limit Reached","Resource Creation Restricted"]} ]},
  examAnswer:"A Budget monitors spend and sends an alert when a threshold is crossed — it does not block anything. A Quota restricts resource-type consumption and actively blocks creation once the limit is hit.",
  realWorld:"A Budget is like a bank app that texts you when you're close to your monthly spending limit — it warns you but doesn't stop the transaction. A Quota is like a debit card with a hard daily cap that gets declined once you hit it.",
  mcq:{ question:"What happens when an OCI Budget threshold is reached?", options:["Resource creation is blocked automatically","An alert notification is sent, but nothing is blocked","The compartment is deleted","A Quota is automatically created"], correctIndex:1 }
},
{
  id:8, day:2, topic:"Security Advisor",
  question:"During a security posture review, an administrator wants OCI-generated guidance rather than an automated blocking control. What does Security Advisor provide, and what is an example of the type of improvement its recommendations can highlight?",
  answer:"Security Advisor scans the tenancy's configuration against OCI security best practices and returns prioritized, actionable recommendations — it does not detect active threats or automatically fix anything, it advises. Example: it might recommend enabling MFA for users who don't have it enabled.",
  explanation:"Security Advisor is a recommendation/advisory engine, distinct from Cloud Guard (detects and responds to active problems) and Security Zones (preventively blocks non-compliant resource creation).",
  theory:{ what:"Security Advisor evaluates a tenancy's configuration against Oracle's recommended security best practices.", why:"It gives administrators a prioritized checklist of concrete improvements without requiring them to know every OCI best practice.", how:"It scans IAM, networking, storage and other settings, compares them to best-practice baselines, and surfaces actionable recommendations.", example:"Security Advisor flags that the 'Administrators' group does not require MFA and recommends enabling it." },
  quick:"Security Advisor recommends best-practice security improvements based on the tenancy's current configuration — it advises, it doesn't detect threats or block anything.",
  remember:["Advisor = Recommend"],
  trap:"Students often confuse Security Advisor with Cloud Guard. Security Advisor gives periodic best-practice recommendations; Cloud Guard continuously detects and responds to active security problems.",
  wrongOptionsNote:"An answer claiming Security Advisor 'blocks' insecure resources is wrong — that preventive behavior belongs to Security Zones.",
  diagram:{type:"linear", steps:["Tenancy Configuration","Security Advisor Scan","Compared to Best Practices","Prioritized Recommendations (e.g., Enable MFA)"]},
  examAnswer:"Security Advisor evaluates configuration against OCI best practices and returns prioritized recommendations, such as enabling MFA — it advises but does not detect threats or block resources.",
  realWorld:"Like a home inspector who walks through your house and hands you a checklist of recommended fixes (install smoke detectors, fix the loose railing) — they point things out, they don't fix them for you.",
  mcq:{ question:"What does OCI Security Advisor primarily do?", options:["Automatically blocks non-compliant resources","Continuously detects and responds to active threats","Recommends security best-practice improvements based on configuration","Encrypts all tenancy data automatically"], correctIndex:2 }
},
{
  id:9, day:2, topic:"Cloud Guard",
  question:"A security operations team wants OCI to identify risky configurations and then trigger appropriate remediation for selected findings. Which Cloud Guard components participate in this workflow, and what is the responsibility of each?",
  answer:"Cloud Guard continuously monitors OCI resources using Detectors, which apply detector recipes to identify security problems. When found, the problem is surfaced and can trigger a Responder, which executes a corrective action (automatically or with approval) to remediate the issue.",
  explanation:"Cloud Guard is OCI's continuous detect-and-respond security posture tool. Detectors find problems, Responders fix problems — together forming a closed monitoring-and-remediation loop.",
  theory:{ what:"Cloud Guard is an OCI native security service that continuously monitors resources, detects misconfigurations and threats, and can automatically respond to them.", why:"Manual reviews cannot keep up with a dynamic cloud environment — Cloud Guard provides continuous, automated detection and remediation.", how:"Detector recipes continuously scan resources and activity logs for risky patterns, generating a Problem when found. Responder recipes then define corrective action, automatically or after admin approval.", example:"A Configuration Detector notices a bucket was made public. Cloud Guard raises a Security Problem, and a Responder automatically makes the bucket private again." },
  quick:"Cloud Guard continuously detects security problems using Detectors and can automatically fix them using Responders — a closed detect-and-respond loop.",
  remember:["Detector = Detect","Responder = Respond"],
  trap:"Exams often test whether students think Cloud Guard prevents resources from being created in the first place — it does not. Prevention at creation-time is the job of Security Zones.",
  wrongOptionsNote:"An answer that swaps the roles (Responder detects, Detector fixes) reverses the correct definitions.",
  diagram:{type:"linear", steps:["OCI Resources","Cloud Guard","Detector","Security Problem","Responder","Corrective Action"]},
  examAnswer:"Cloud Guard continuously monitors resources. Detectors identify security problems; Responders execute corrective actions to remediate them, automatically or with approval.",
  realWorld:"Like a smart home security system: motion sensors (Detectors) notice someone at the door, and the system (Responder) can automatically lock the doors or call the police.",
  mcq:{ question:"In Cloud Guard, what is the role of a Responder?", options:["It detects the security problem","It executes a corrective action to fix a detected problem","It generates the security recommendation report","It approves new IAM policies"], correctIndex:1 }
},
{
  id:10, day:2, topic:"BYOL vs License Included",
  question:"A company has existing licenses for software that it plans to run with an OCI service. The architect is comparing bringing those licenses to OCI with purchasing the license as part of the cloud service. When is the existing-license model appropriate, and how does it differ from License Included?",
  answer:"With License Included (LI), Oracle bundles the software license into the OCI service's rate. With Bring Your Own License (BYOL), the customer uses licenses they already own and pays OCI only for the underlying infrastructure, at a lower rate. The organization should choose BYOL because it already owns eligible licenses — reusing them avoids paying for a license twice.",
  explanation:"BYOL vs License Included is purely a cost/licensing decision, not a technical one — the underlying OCI service works the same either way. The determining factor is whether the customer already holds eligible, unused licenses.",
  theory:{ what:"License Included means the OCI service price includes the software license cost. BYOL means the customer supplies their own already-purchased license and pays only for infrastructure.", why:"Organizations that already invested in Oracle software licenses can reuse them in OCI instead of paying for a duplicate license bundled into the service price.", how:"When provisioning a licensable OCI service, the customer selects a licensing option. BYOL requires enough eligible, unused licenses to cover the deployment; the service is then billed at the infrastructure-only rate.", example:"A company already owns Oracle Database Enterprise Edition licenses. They select BYOL and pay only the compute/storage rate, saving the bundled license cost." },
  quick:"License Included bundles the license into OCI's price; BYOL lets you reuse licenses you already own and pay only for infrastructure. Choose BYOL when you already hold eligible licenses.",
  remember:["LI = License + Infra bundled","BYOL = Bring your own License, pay Infra only"],
  trap:"A trap is assuming BYOL is always cheaper regardless of circumstances — it's only advantageous when the organization genuinely already owns unused, eligible licenses.",
  wrongOptionsNote:"Claiming BYOL changes the technical capability of the service is incorrect — the licensing choice affects billing only.",
  diagram:{type:"compare", tracks:[ {title:"License Included", steps:["No existing license","Oracle provides license","Pay bundled infra + license rate"]}, {title:"BYOL", steps:["Existing eligible license owned","Bring license to OCI","Pay infrastructure-only rate"]} ]},
  examAnswer:"License Included bundles license cost into the service price; BYOL lets an organization apply licenses it already owns and pay only the infrastructure rate. Choose BYOL whenever eligible unused licenses already exist.",
  realWorld:"Like bringing your own streaming subscription's login to a friend's smart TV instead of paying for a separate subscription bundled with the TV.",
  mcq:{ question:"When should an organization choose BYOL over License Included?", options:["When it wants Oracle to fully manage licensing regardless of cost","When it already owns eligible, unused licenses","When it has no existing licenses","BYOL and License Included are technically identical, so it never matters"], correctIndex:1 }
},
{
  id:11, day:2, topic:"Budget & Cost Analysis",
  question:"The finance team wants an automatic warning before cloud spending exceeds its approved amount and also needs to analyze charges by service, compartment, and other dimensions. Which OCI cost-management features should they use and what does each one answer?",
  answer:"Use a Budget to set a spending threshold and receive alerts as spend approaches or exceeds it. Use Cost Analysis to visually explore and break down where the tenancy's spend is coming from — by compartment, service, or tag.",
  explanation:"Budget and Cost Analysis are complementary but distinct: Budget is proactive alerting against a target amount, while Cost Analysis is exploratory/visual reporting to understand spend composition and trends.",
  theory:{ what:"Budget is a threshold-based spend-alerting feature; Cost Analysis is an interactive visualization tool for exploring cost and usage data.", why:"Together they cover both halves of cost governance: getting warned before overspending, and understanding the 'why' behind the numbers.", how:"A Budget is set against a compartment or tag with alert thresholds that trigger notifications. Cost Analysis lets you filter and group historical spend by compartment, service, SKU, or tag over custom date ranges.", example:"A Budget alerts finance at 80% of the monthly cap. The admin opens Cost Analysis, groups by service, and discovers most spend is coming from an oversized Block Volume allocation." },
  quick:"Budget sends threshold-based spend alerts; Cost Analysis visualizes and breaks down where the spend is actually coming from.",
  remember:["Budget = Warns you","Cost Analysis = Explains it"],
  trap:"Students sometimes think Cost Analysis can send alerts, or that Budget provides a service breakdown — Budget only tracks a single target and alerts.",
  wrongOptionsNote:"Suggesting only one of the two features fully answers the question is incomplete — the requirement has two parts, each mapping to a different feature.",
  diagram:{type:"compare", tracks:[ {title:"Budget", steps:["Set spend threshold","Monitor spend vs threshold","Send alert notification"]}, {title:"Cost Analysis", steps:["Pull usage & cost data","Group by compartment/service/tag","Visualize spend breakdown"]} ]},
  examAnswer:"Use Budget to set a threshold and get alerted as spend approaches it. Use Cost Analysis to visually break down where that spend is coming from by compartment, service, or tag.",
  realWorld:"A Budget is your monthly spending alert; Cost Analysis is like your bank statement's category breakdown, showing exactly how much went to groceries vs. entertainment.",
  mcq:{ question:"Which OCI feature would you use to understand WHERE tenancy spend is coming from (by service/compartment/tag)?", options:["Budget","Cost Analysis","Quota","Security Advisor"], correctIndex:1 }
},
{
  id:12, day:2, topic:"Service Limit vs Quota",
  question:"A team is unable to create another resource even though the service appears to support more capacity overall. The administrator suspects that a tenancy-level service limit and a compartment-level quota are being confused. Explain the distinction and how each can affect resource creation.",
  answer:"A Service Limit is the maximum amount of a resource an Oracle tenancy is allowed to use, set by Oracle. A Quota is an administrator-defined restriction that caps resource consumption within a compartment — set below the service limit for internal governance. The described restriction, occurring before the overall tenancy limit is hit, is caused by a Quota, not the Service Limit.",
  explanation:"Service Limits and Quotas both cap resource counts, but at different layers: Oracle sets the outer Service Limit for the whole tenancy/region; the customer optionally sets a tighter inner Quota per compartment.",
  theory:{ what:"A Service Limit is Oracle's tenancy/region-wide ceiling on a resource. A Quota is a customer-defined, compartment-level restriction equal to or tighter than the Service Limit.", why:"Service Limits protect Oracle's infrastructure and give a safe operating ceiling; Quotas let customers subdivide that ceiling internally.", how:"Service Limits can be increased via a service request to Oracle. Quotas are written by administrators using quota-policy statements and always apply within the Oracle service limit.", example:"The tenancy's Service Limit allows 100 compute instances region-wide, but the admin sets a Quota of 10 for the Development compartment — creation is blocked at 10 even though the tenancy is far from 100." },
  quick:"Service Limit = Oracle's tenancy-wide ceiling on a resource. Quota = a customer-set, compartment-level restriction inside that ceiling.",
  remember:["Service Limit = Oracle's outer wall","Quota = Customer's inner fence"],
  trap:"The exam trap is assuming any resource-creation block means the tenancy is 'out of capacity' — a block can happen well before the true Service Limit because an admin-defined Quota is tighter.",
  wrongOptionsNote:"Assuming only Oracle can restrict resource creation is wrong — Quotas are explicitly a customer/administrator-controlled restriction.",
  diagram:{type:"compare", tracks:[ {title:"Service Limit", steps:["Set by Oracle","Tenancy/Region-wide ceiling","Raised via Oracle service request"]}, {title:"Quota", steps:["Set by Administrator","Compartment-level restriction","Always within the Service Limit"]} ]},
  examAnswer:"A Service Limit is Oracle's maximum allowed resource usage. A Quota is a customer-defined, compartment-scoped restriction inside that limit. The described block is a Quota, since it occurred before the true Service Limit was reached.",
  realWorld:"The building has a fire-code capacity of 500 people (Service Limit set by the city), but the office manager caps meeting room bookings to 20 people (Quota) well before that fire-code number is ever reached.",
  mcq:{ question:"A resource creation is blocked well before the tenancy's true capacity is reached. What is the most likely cause?", options:["The Oracle-wide Service Limit was reached","A customer-defined Quota is restricting that compartment","The region is out of Availability Domains","Cloud Guard blocked the resource"], correctIndex:1 }
},
{
  id:13, day:2, topic:"Defense in Depth",
  question:"A security architect refuses to depend on a single control for a production application. Describe the security design principle behind this decision and give an OCI example where multiple independent controls work together.",
  answer:"This describes Defense in Depth — layering multiple, independent security controls so that if one layer fails, others still protect the workload. An OCI example: combining Network Security Groups (network layer), IAM policies with MFA (identity layer), and data encryption at rest (data layer) around the same workload.",
  explanation:"Defense in Depth assumes that no single control is perfect. Stacking independent layers — network, identity, application, data, and monitoring — means a failure at one layer is caught or mitigated by another.",
  theory:{ what:"Defense in Depth is a security strategy that uses multiple, independent layers of controls rather than relying on any single protective measure.", why:"Every individual control can fail or be bypassed; layering ensures a single point of failure does not lead to a full breach.", how:"Apply controls at every relevant layer: network (NSGs, Security Lists), identity (IAM, MFA), application, data (encryption), and monitoring (Cloud Guard, Audit).", example:"A database is protected by an NSG restricting inbound traffic, an IAM policy limiting who can manage it, encryption at rest, and Cloud Guard monitoring — four independent layers." },
  quick:"Defense in Depth layers multiple independent security controls (network, identity, data, monitoring) so no single failure exposes the workload.",
  remember:["Defense in Depth = Many Layers, One Goal"],
  trap:"Students sometimes name only one control (e.g., 'just use a firewall') when asked for the principle — the whole point is that it's never just one control.",
  wrongOptionsNote:"Naming Zero Trust instead of Defense in Depth is a common mix-up — Zero Trust is about not trusting network location by default; Defense in Depth is about stacking multiple layered controls.",
  diagram:{type:"layers", layers:[ {label:"Monitoring", detail:"Cloud Guard, Audit Logs"}, {label:"Data", detail:"Encryption at rest / in transit"}, {label:"Identity", detail:"IAM Policies, MFA"}, {label:"Network", detail:"NSGs, Security Lists"} ]},
  examAnswer:"Defense in Depth uses multiple independent security layers so no single control's failure compromises the workload. Example: NSGs + IAM policies with MFA + encryption at rest + Cloud Guard monitoring around the same workload.",
  realWorld:"Like a medieval castle: a moat, a wall, a locked gate, and guards inside — if an intruder gets past one layer, more layers stand between them and the treasure.",
  mcq:{ question:"What does the Defense in Depth principle recommend?", options:["Rely on one very strong control, like a firewall","Use multiple independent layers of security controls","Rely entirely on Zero Trust and skip network controls","Only secure the data layer, since that's most valuable"], correctIndex:1 }
},
{
  id:14, day:2, topic:"CIA Triad",
  question:"A healthcare application must keep records secret from unauthorized users, prevent unauthorized changes, and remain accessible to authorized staff. Map these three requirements to the three elements of the CIA model.",
  answer:"Confidentiality protects data from unauthorized disclosure — enforced through IAM policies and encryption. Integrity protects data from unauthorized or accidental alteration — enforced through hashing, checksums, and access controls. Availability ensures data and services remain accessible to authorized users when needed — enforced through redundancy, high availability, and disaster recovery.",
  explanation:"The CIA triad is the foundational model for reasoning about security objectives. Every security control can be mapped to protecting one or more of these three properties.",
  theory:{ what:"The CIA triad is a foundational information-security model of Confidentiality, Integrity, and Availability.", why:"It gives a simple, complete framework for evaluating whether a control actually addresses a real risk.", how:"Confidentiality via encryption and IAM. Integrity via checksums, digital signatures, versioning. Availability via redundancy across Fault Domains/ADs/Regions, backups, and DR planning.", example:"Encrypting a database protects Confidentiality; enabling object versioning protects Integrity; deploying across multiple ADs protects Availability." },
  quick:"Confidentiality = keep data secret, Integrity = keep data correct/unaltered, Availability = keep data/services accessible.",
  remember:["Confidentiality = Secret","Integrity = Correct","Availability = Accessible"],
  trap:"Students sometimes swap Integrity and Availability — Integrity is about correctness/tamper-protection, Availability is purely about uptime/access.",
  wrongOptionsNote:"Describing Confidentiality as 'making sure data isn't lost' confuses it with backup/Availability concerns — Confidentiality is strictly about unauthorized disclosure.",
  diagram:{type:"tree", root:"CIA Triad", children:["Confidentiality — Secret","Integrity — Correct","Availability — Accessible"]},
  examAnswer:"CIA = Confidentiality (prevent unauthorized disclosure), Integrity (prevent unauthorized/accidental alteration), Availability (ensure authorized access when needed).",
  realWorld:"Confidentiality is a locked diary (only you can read it). Integrity is a sealed envelope (no one can secretly change the letter inside). Availability is the mail service actually delivering it on time.",
  mcq:{ question:"Which CIA principle is protected by encrypting data at rest?", options:["Availability","Confidentiality","Integrity","Accountability"], correctIndex:1 }
},
{
  id:15, day:2, topic:"Zero Trust",
  question:"An organization previously trusted requests simply because they originated inside its corporate network. It is moving to a model that evaluates every access request based on identity, context, and policy. Which security approach is this, and what principle drives it?",
  answer:"A traditional perimeter model trusts anything inside the corporate network boundary by default and only inspects traffic at the edge. Zero Trust removes that assumption entirely — no user, device, or request is trusted by default, regardless of network location; every request must be authenticated and authorized on its own merits. A fundamental Zero Trust principle: 'Never trust, always verify.'",
  explanation:"Zero Trust responds to the reality that threats can originate from inside the network just as easily as from outside — so trust must never be granted based on network location alone.",
  theory:{ what:"Zero Trust is a security model in which no user, device, or system is trusted by default, even if it is already inside the corporate network perimeter.", why:"Perimeter-based trust fails once an attacker or compromised credential gets inside the network — Zero Trust removes the 'soft interior.'", how:"Every access request is authenticated and authorized individually, typically using MFA, least-privilege access, and continuous monitoring rather than relying on network segmentation alone.", example:"Under Zero Trust, an employee on the corporate VPN still has to pass MFA and a scoped IAM policy check to access an OCI resource." },
  quick:"Zero Trust assumes no implicit trust based on network location — every request is verified individually. Core principle: 'Never trust, always verify.'",
  remember:["Zero Trust = Verify Every Time","Perimeter Model = Trust Inside, Guard Only the Edge"],
  trap:"A trap answer describes Zero Trust as simply 'more firewalls' — it's fundamentally about identity-based, continuous verification.",
  wrongOptionsNote:"Stating Zero Trust eliminates the need for IAM policies is wrong — it actually depends heavily on strong identity verification and IAM.",
  diagram:{type:"compare", tracks:[ {title:"Perimeter Model", steps:["Inside network = trusted","Guard only at the edge","Minimal internal verification"]}, {title:"Zero Trust", steps:["No implicit trust, anywhere","Verify every request","Continuous authentication & authorization"]} ]},
  examAnswer:"Perimeter models trust anything inside the network boundary; Zero Trust removes that assumption and verifies every request regardless of location. Fundamental principle: never trust, always verify.",
  realWorld:"Like a high-security office that re-checks your ID badge at every single door, even if you already badged into the building lobby — being 'inside' grants no extra trust.",
  mcq:{ question:"What is a core Zero Trust principle?", options:["Trust any device inside the corporate network","Never trust, always verify — regardless of network location","Rely solely on perimeter firewalls","Grant broad access once MFA is enabled once"], correctIndex:1 }
},
{
  id:16, day:2, topic:"Shared Responsibility Model",
  question:"An OCI customer believes Oracle should configure every security control for its workload. Explain how security responsibilities are divided between Oracle and the customer, and give one example responsibility for each side.",
  answer:"The Shared Responsibility Model divides security duties between Oracle and the customer: Oracle secures the underlying cloud infrastructure ('security OF the cloud') — physical data center security, hardware, and virtualization — while the customer secures what they configure and put in the cloud ('security IN the cloud') — e.g., IAM policy configuration and data classification/access control.",
  explanation:"This model corrects the common misconception that moving to the cloud means Oracle handles all security. A customer's misconfiguration (e.g., an overly permissive IAM policy) is the customer's own responsibility.",
  theory:{ what:"The Shared Responsibility Model defines which security tasks Oracle handles versus which the customer must handle.", why:"It sets clear expectations so customers understand which risks remain entirely their own responsibility, even in a fully managed cloud.", how:"Oracle handles physical data centers, hardware, network infra, and the hypervisor. The customer handles IAM configuration, security rules they define, OS-level patching (IaaS), data classification, and application security.", example:"Oracle ensures the physical data center and host hardware are secure; the customer ensures a compute instance isn't accidentally exposed via a wrong IAM policy." },
  quick:"Oracle secures the cloud infrastructure itself; the customer secures what they configure and store in it. Misconfiguration is always the customer's responsibility.",
  remember:["Oracle = Security OF the Cloud","Customer = Security IN the Cloud"],
  trap:"The exam trap is assuming Oracle patches/secures everything including the customer's OS and application layer for IaaS — for IaaS, OS patching remains the customer's responsibility.",
  wrongOptionsNote:"Claiming the customer is responsible for physical data center security is incorrect — that is exclusively Oracle's responsibility.",
  diagram:{type:"compare", tracks:[ {title:"Oracle — OF the Cloud", steps:["Physical data centers","Hardware & network infra","Hypervisor / virtualization"]}, {title:"Customer — IN the Cloud", steps:["IAM policy configuration","Data classification & access","OS patching (IaaS)"]} ]},
  examAnswer:"Shared Responsibility Model: Oracle secures the underlying cloud infrastructure; the customer secures what they configure and run in it. Misconfiguration risk always stays with the customer.",
  realWorld:"Like renting an apartment: the landlord secures the building's locks and structure, but you're responsible for locking your own apartment door and not leaving your key under the mat.",
  mcq:{ question:"Under the Shared Responsibility Model, who is responsible for correctly configuring IAM policies?", options:["Oracle","The customer","Both equally, with no distinction","Neither — IAM is automatically configured"], correctIndex:1 }
},
{
  id:17, day:2, topic:"Security Zones",
  question:"A compliance team wants OCI to stop administrators from creating resources that violate mandatory security configurations. Which OCI control should be selected, and how does it differ from a service that mainly detects problems after resources exist?",
  answer:"Use OCI Security Zones. Its primary purpose is preventive: it attaches a set of security policies to a compartment and blocks — at creation time — any resource action that would violate those policies, rather than only detecting the violation afterward.",
  explanation:"Security Zones is the only one of OCI's three security-posture tools that actively prevents non-compliant actions before they happen, instead of detecting/recommending after the fact.",
  theory:{ what:"Security Zones enforces a defined set of security best-practice policies on a compartment, blocking any resource creation or update that would violate them.", why:"Detection after the fact is valuable, but some organizations need a hard guarantee that non-compliant resources can never even be created.", how:"An administrator attaches a Security Zone recipe (predefined policies) to a compartment. OCI evaluates every resource action against those policies in real time and rejects violations.", example:"A recipe requiring 'no internet-facing subnets' is attached to Production — an attempt to create a public subnet there is blocked immediately." },
  quick:"Security Zones prevents non-compliant resource configurations by blocking violating actions at creation time within an attached compartment.",
  remember:["Zones = Prevent"],
  trap:"Students often answer 'Cloud Guard' for this question — but Cloud Guard only detects and responds after the fact; only Security Zones actively blocks creation.",
  wrongOptionsNote:"Answering 'Security Advisor' is also wrong — Security Advisor only recommends, it does not block anything.",
  diagram:{type:"linear", steps:["Security Zone Recipe (Policies)","Attached to Compartment","Resource Creation Attempted","Evaluated Against Policies","Non-compliant Action Blocked"]},
  examAnswer:"Use Security Zones. Its primary purpose is preventive — it blocks the creation of resources that would violate the security policies attached to a compartment.",
  realWorld:"Like a construction site that won't let a truck through the gate at all unless it passes a safety checklist — it's blocked at the gate, not flagged after it's already inside.",
  mcq:{ question:"Which OCI feature actively blocks the creation of non-compliant resources?", options:["Cloud Guard","Security Advisor","Security Zones","Cost Analysis"], correctIndex:2 }
},
{
  id:18, day:2, topic:"Security Posture Management",
  question:"A security manager is designing a tenancy-wide posture program and wants three complementary capabilities: identify security problems, prevent prohibited configurations, and receive recommendations for improvements. Which OCI features fit those three roles?",
  answer:"Combine all three complementary OCI security-posture tools: Cloud Guard for continuous detection and automated response, Security Zones for preventive guardrails, and Security Advisor for best-practice configuration recommendations.",
  explanation:"No single tool covers detect, prevent, and recommend — each requirement maps to exactly one OCI security posture service, and a complete approach uses all three together.",
  theory:{ what:"Security posture management is the combined use of monitoring, preventive, and advisory tools to continuously improve a tenancy's security state.", why:"Relying on only one tool leaves gaps — detection alone doesn't prevent bad configurations, prevention alone doesn't catch active threats.", how:"Enable Cloud Guard tenancy-wide, attach Security Zone recipes to sensitive compartments, and regularly review Security Advisor recommendations.", example:"A tenancy enables Cloud Guard to catch a misconfigured bucket, attaches a Security Zone to Production to prevent that entirely, and reviews Security Advisor weekly." },
  quick:"A complete security posture uses all three tools together: Cloud Guard (detect + respond), Security Zones (prevent), and Security Advisor (recommend).",
  remember:["Cloud Guard = Detect & Respond","Security Zones = Prevent","Security Advisor = Recommend"],
  trap:"Picking just one of the three tools when the question asks for continuous monitoring AND prevention AND recommendations is an incomplete answer.",
  wrongOptionsNote:"Treating Cloud Guard and Security Zones as interchangeable is incorrect — one is reactive/detective, the other preventive.",
  diagram:{type:"tree", root:"Security Posture Management", children:["Cloud Guard — Detect & Respond","Security Zones — Prevent","Security Advisor — Recommend"]},
  examAnswer:"Use Cloud Guard for continuous detection/response, Security Zones for preventive enforcement, and Security Advisor for ongoing recommendations — together a complete security posture approach.",
  realWorld:"Like airport security: cameras that detect suspicious behavior (Cloud Guard), a metal detector that physically blocks banned items (Security Zones), and a safety audit report (Security Advisor) — all working together.",
  mcq:{ question:"Which combination provides complete security posture management (detect, prevent, recommend)?", options:["Cloud Guard only","Security Zones only","Cloud Guard + Security Zones + Security Advisor","IAM Policies only"], correctIndex:2 }
},
{
  id:19, day:2, topic:"Cost Governance by Department",
  question:"Five business units share one OCI tenancy and leadership needs monthly spend visibility for each unit. Design a governance approach using resource organization and metadata so finance can attribute charges without creating a separate tenancy for every department.",
  answer:"Create a compartment per department (or a mandatory 'Department' cost-tracking tag if a shared compartment structure must remain), set a separate Budget per department, and use Cost Analysis grouped by compartment or tag to monitor each department's spend individually.",
  explanation:"This combines three governance tools: Compartments (or Tags) for attribution, Budgets for per-department alerting, and Cost Analysis for ongoing visibility — applied at the department level.",
  theory:{ what:"Department-level cost governance combines structural isolation with financial monitoring tools so spend can be tracked per organizational unit.", why:"Without a per-department boundary, all spend is blended and no single department can be held accountable.", how:"Create a compartment for each department, set an individual Budget for each with its own thresholds, and use Cost Analysis grouped by compartment or tag.", example:"'Marketing' and 'Engineering' each get their own compartment and their own $10,000 Budget; Cost Analysis shows each department's trend independently." },
  quick:"Give each department its own compartment (or tag), its own Budget for alerts, and use Cost Analysis grouped by compartment/tag for ongoing visibility.",
  remember:["1 Department = 1 Compartment (or Tag) = 1 Budget"],
  trap:"A trap is recommending only Cost Analysis without any Budget — Cost Analysis alone provides visibility but no proactive alerting.",
  wrongOptionsNote:"Recommending a single tenancy-wide Budget for all five departments combined fails the requirement to monitor each department separately.",
  diagram:{type:"linear", steps:["Compartment (or Tag) per Department","Budget set per Department","Cost Analysis grouped by Compartment/Tag","Per-department spend visibility"]},
  examAnswer:"Create a compartment (or consistent tag) per department, configure an individual Budget per department, and use Cost Analysis grouped by compartment/tag to monitor each department's spend independently.",
  realWorld:"Like a shared family credit card being split into separate authorized-user cards per family member, each with a spending alert set for their own limit.",
  mcq:{ question:"What is the best approach to track spend separately for 5 departments sharing one tenancy?", options:["One shared Budget for the whole tenancy","Compartment/tag per department with individual Budgets","Ask each department to self-report spend manually","Disable cost tracking for shared resources"], correctIndex:1 }
},
{
  id:20, day:2, topic:"Compliance Audit Review",
  question:"An organization is preparing evidence for an internal OCI compliance review. Which two categories of control evidence would you inspect first, and which OCI records or governance mechanisms could provide that evidence?",
  answer:"Review (1) IAM configuration — group memberships, policy scope, and MFA enrollment — with evidence from the Identity console; and (2) activity/change history — who did what and when — with evidence from the Audit service, which retains a record of API calls and console actions.",
  explanation:"A compliance audit needs to answer two questions: 'who can access what' and 'what actually happened' — OCI provides a distinct, purpose-built source of evidence for each.",
  theory:{ what:"Compliance review areas are the configuration and activity domains an auditor examines to confirm a tenancy meets required standards.", why:"Auditors need concrete, retrievable evidence that access controls are correctly scoped and that changes are tracked and attributable.", how:"Pull Groups, Policy statements, and MFA status from the Identity console for access review. Pull records from the Audit service, which logs every API call (who, what, when, from where).", example:"An auditor asks 'who can delete production databases?' — answered via IAM policies in the Identity console. Then 'was this policy ever changed without approval?' — answered via the Audit service." },
  quick:"Review IAM configuration (evidence: Identity console) and activity/change history (evidence: Audit service) as the two core compliance audit areas.",
  remember:["IAM → Identity Console","Activity → Audit Service"],
